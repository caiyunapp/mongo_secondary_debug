[package]
name = "mongo_secondary_debug"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mongo_secondary_debug"
path = "src/main.rs"

[dependencies]
mongodb = { version = "3.7", features = ["tracing-unstable"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
